<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Exchange Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Course Exchange Assistant</h1>
    <p class="intro">Tell us what you need to cover, and we'll suggest exchange courses with a source for each one.</p>

    <form id="match-form">
      <label>Home university
        <input name="home_university" required>
      </label>
      <label>Exchange university
        <input name="exchange_university" required>
      </label>
      <fieldset id="home-courses">
        <legend>Home courses I need to cover</legend>
        <p class="hint">Loading courses...</p>
      </fieldset>
      <label>Credits I need (ECTS)
        <input name="credits_needed" type="number" min="1" step="0.5" required>
      </label>
      <label>Question <span class="hint">(optional)</span>
        <input name="question" placeholder="e.g. Which courses are taught in English?">
      </label>
      <button type="submit">Find matching courses</button>
    </form>

    <p id="message" role="status"></p>
    <p id="summary"></p>
    <section id="results"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
